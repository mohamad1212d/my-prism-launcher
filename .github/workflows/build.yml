name: Build Prism Launcher

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Release

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            vcvars-arch: amd64
            qt-version: 6.10.2

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:
      # 1. جلب المستودع الرئيسي بكامل مكتباته المكتملة
      - name: Checkout Upstream Base with Submodules
        uses: actions/checkout@v4
        with:
          repository: 'PrismLauncher/PrismLauncher'
          submodules: recursive
          fetch-depth: 0

      # 2. جلب كودك أنت المعدّل واستبدال ملفات المصدر به
      - name: Overlay My Source Code
        uses: actions/checkout@v4
        with:
          path: 'my_code'

      - name: Copy My Code Over Upstream
        run: |
          cp -rf my_code/* .
          rm -rf my_code

      # 3. إكمال خطوات التجميع والبناء
      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-${{ matrix.artifact-name }}-${{ steps.short-version.outputs.version }}
          path: build/package/*
